name: Animação das contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Gera a animação a partir do gráfico de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribuicoes-escuro.svg?palette=github-dark&color_snake=#4FA3E0&color_dots=#161b22,#0b3a5c,#0e75b6,#3b8fd0,#7fc4f0
            dist/contribuicoes-claro.svg?color_snake=#0e75b6&color_dots=#ebedf0,#bfdcf2,#7fbbe6,#3b8fd0,#0e75b6

      - name: Publica no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Atualiza animação das contribuições
          author: Arthur Gomes <203029265+taksz@users.noreply.github.com>
          committer: Arthur Gomes <203029265+taksz@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
